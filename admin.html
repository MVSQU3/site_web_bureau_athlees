<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<title>Admin · Bureau des Athlètes</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--txt:#f5f5f7;--mut:#86868b;--line:#333;--acc:#2997ff}
@media (prefers-color-scheme:light){:root{--bg:#f5f5f7;--card:#fff;--txt:#1d1d1f;--mut:#6e6e73;--line:#d2d2d7;--acc:#0071e3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:32px 16px}h1{font-size:32px;letter-spacing:-.02em;margin:0 0 20px}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:10px 14px;background:var(--card);color:var(--txt)}
button{background:var(--acc);border:0;color:#fff;cursor:pointer}button.ghost{background:none;color:var(--mut);border:1px solid var(--line)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.bar .sp{flex:1}
.m{background:var(--card);border-radius:16px;padding:18px 20px;margin-bottom:12px}.m h3{margin:0 0 2px;font-size:16px}
.meta{color:var(--mut);font-size:13px}.m p{white-space:pre-wrap;margin:10px 0 0}.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-left:6px}
.tabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;width:fit-content}.tabs button{background:none;color:var(--mut);padding:8px 16px}.tabs button.on{background:var(--acc);color:#fff}
select{font:inherit;border-radius:12px;border:1px solid var(--line);padding:10px 14px;background:var(--card);color:var(--txt)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:12px}.err{color:#ff453a}a{color:var(--acc)}
</style>
</head>
<body><div class="wrap">
<h1>Administration</h1>
<form class="bar" id="login"><input type="password" id="pw" placeholder="Mot de passe admin" required><button>Se connecter</button><span class="err" id="err"></span></form>
<div id="app" hidden>
  <div class="bar"><div class="tabs" id="tabs"><button data-t="inscriptions" class="on">Inscriptions</button><button data-t="messages">Messages</button></div><select id="filtre" hidden></select><span id="count" class="meta"></span><span class="sp"></span><button class="ghost" id="csv">Exporter CSV</button><button class="ghost" id="out">Déconnexion</button></div>
  <div class="stats meta" id="stats"></div>
  <div id="list"></div>
</div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let pw = sessionStorage.getItem("pw") || "", rows = [], tab = "inscriptions";
const api = (q = "", opt = {}) => fetch("/api/messages?type=" + tab + q, { ...opt, headers: { Authorization: "Bearer " + pw } });
const dt = (v) => new Date(v).toLocaleString("fr-FR");
const day = (v) => new Date(v).toLocaleDateString("fr-FR", { timeZone: "UTC" });
const del = (id) => `<button class="ghost" data-id="${id}">Supprimer</button>`;
const visible = () => { const f = $("#filtre").value; return tab === "inscriptions" && f ? rows.filter((r) => r.tableaux.includes(f)) : rows; };
function render() {
  const list = visible();
  $("#count").textContent = list.length + (tab === "inscriptions" ? " inscription(s)" : " message(s)");
  if (tab === "messages") {
    $("#stats").innerHTML = "";
    $("#list").innerHTML = list.map((m) => `<div class="m"><div class="row"><div><h3>${esc(m.nom)}<span class="tag">${esc(m.objet)}</span></h3><div class="meta"><a href="mailto:${esc(m.email)}">${esc(m.email)}</a> · ${dt(m.created_at)}</div></div>${del(m.id)}</div><p>${esc(m.message)}</p></div>`).join("") || '<p class="meta">Aucun message pour le moment.</p>';
    return;
  }
  const counts = {}; rows.forEach((r) => r.tableaux.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  $("#stats").innerHTML = Object.entries(counts).map(([t, n]) => `<span class="tag">${esc(t)} : <b>${n}</b></span>`).join("");
  $("#list").innerHTML = list.map((r) => `<div class="m"><div class="row"><div><h3>${esc(r.nom)}${r.prenom ? " " + esc(r.prenom) : ""}<span class="tag">${esc(r.sexe)}</span>${r.categorie ? `<span class="tag">${esc(r.categorie)}</span>` : ""}</h3>
    <div class="meta">Né(e) le ${day(r.naissance)} · ${esc(r.club)} · Licencié : ${r.licencie === true ? "oui" : r.licencie === false ? "non" : "—"}${r.telephone ? ` · <a href="tel:${esc(r.telephone.replace(/\s/g, ""))}">${esc(r.telephone)}</a>` : ""}</div>
    <div class="meta">Inscrit(e) le ${dt(r.created_at)}${r.partenaire ? " · Coéquipier : " + esc(r.partenaire) : ""}</div>
    <div class="chips">${r.tableaux.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>${del(r.id)}</div></div>`).join("") || '<p class="meta">Aucune inscription pour le moment.</p>';
}
async function load() {
  const r = await api();
  if (r.status === 401) { sessionStorage.removeItem("pw"); $("#err").textContent = pw ? "Mot de passe incorrect." : ""; $("#login").hidden = false; $("#app").hidden = true; return; }
  if (!r.ok) { $("#err").textContent = "Erreur serveur (base de données configurée ?)"; return; }
  sessionStorage.setItem("pw", pw);
  rows = (await r.json())[tab];
  $("#login").hidden = true; $("#app").hidden = false;
  const tabl = [...new Set(rows.flatMap((x) => x.tableaux || []))].sort();
  const cur = $("#filtre").value;
  $("#filtre").hidden = tab !== "inscriptions";
  $("#filtre").innerHTML = '<option value="">Tous les tableaux</option>' + tabl.map((t) => `<option ${t === cur ? "selected" : ""}>${esc(t)}</option>`).join("");
  render();
}
$("#login").onsubmit = (e) => { e.preventDefault(); pw = $("#pw").value; load(); };
$("#out").onclick = () => { sessionStorage.removeItem("pw"); pw = ""; location.reload(); };
$("#tabs").onclick = (e) => { const t = e.target.dataset.t; if (!t) return; tab = t; $("#filtre").value = ""; $("#tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.target)); load(); };
$("#filtre").onchange = render;
$("#list").onclick = async (e) => { const id = e.target.dataset.id; if (id && confirm("Supprimer définitivement ?")) { await api("&id=" + id, { method: "DELETE" }); load(); } };
$("#csv").onclick = () => {
  const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const list = visible();
  const csv = tab === "messages"
    ? "Date;Nom;E-mail;Objet;Message\n" + list.map((m) => [dt(m.created_at), m.nom, m.email, m.objet, m.message].map(q).join(";")).join("\n")
    : "Date inscription;Nom et prénoms;Naissance;Sexe;Club et ville;Licencié;Catégorie;Compétitions;Tableaux;Coéquipier;Téléphone\n" + list.map((r) => [dt(r.created_at), r.nom + (r.prenom ? " " + r.prenom : ""), day(r.naissance), r.sexe, r.club, r.licencie === true ? "oui" : r.licencie === false ? "non" : "", r.categorie, (r.competitions || []).join(" | "), r.tableaux.join(" | "), r.partenaire, r.telephone].map(q).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = tab + ".csv"; a.click();
};
if (pw) load();
</script>
</body></html>
